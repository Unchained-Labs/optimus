# Categories for auto-generated release notes
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: New features
      labels: [enhancement, feature]
    - title: Bug fixes
      labels: [bug, fix]
    - title: Agents
      labels: [agents]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
