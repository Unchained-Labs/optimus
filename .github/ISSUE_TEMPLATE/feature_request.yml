name: Feature request
description: Suggest an idea or a new agent integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow that's painful today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like optimus to do?
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent (if this is about a specific one)
      placeholder: e.g. Gemini CLI 0.9, aider
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
