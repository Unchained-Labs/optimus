name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/optimus_${os}_${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/Unchained-Labs/optimus/internal/cli.Version=${GITHUB_REF_NAME}" \
              -o "$out/optimus" ./cmd/optimus
            tar -czf "$out.tar.gz" -C "$out" optimus
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt)
          cat dist/checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --generate-notes --verify-tag
